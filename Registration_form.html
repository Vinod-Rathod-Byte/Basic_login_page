<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration form</title>
  </head>
  <body>
    <form>
      <h1>Student Registration form</h1>
      First Name : <input type="text" placeholder="Enter Name" /><br /><br />
      Middle Name :
      <input type="text" placeholder="Enter Middle Name" /><br /><br />
      Last Name :
      <input type="text" placeholder="Enter Last Name" /><br /><br />
      Gender :
      <input type="radio" name="gender" />Male
      <input type="radio" name="gender" />Female
      <input type="radio" name="gender" />Other <br /><br />
      Address <br />
      <textarea cols="30" rows="8"></textarea><br /><br />
      phone no : <input type="number" /><br /><br />
      Email id : <input type="email" /><br /><br />
      Hobbies :<br />
      <label for="1"> <input type="checkbox" id="1" />Coding </label><br />
      <label for="2"> <input type="checkbox" id="2" />Reading </label> <br />
      <label for="3"> <input type="checkbox" id="3" />Playing </label><br />
      <label for="4"> <input type="checkbox" id="4" />Swimming </label
      ><br /><br />
      <input type="submit" value="Button" name="button" /><br /><br />
      <input type="reset" value="reset" name="reset" />
    </form>
  </body>
</html>
